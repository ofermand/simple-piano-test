name: Build installable Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" || { echo "Android sdkmanager was not found"; exit 1; }
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test forgiving note timing
        run: |
          mkdir -p /tmp/simplepiano-timing
          javac -d /tmp/simplepiano-timing \
            app/src/main/java/com/simplepianotest/app/NoteTimingMatcher.java \
            app/src/main/java/com/simplepianotest/app/SongData.java \
            app/src/main/java/com/simplepianotest/app/StaffNoteLayout.java \
            tests/com/simplepianotest/app/NoteTimingMatcherTest.java
          java -cp /tmp/simplepiano-timing com.simplepianotest.app.NoteTimingMatcherTest
      - name: Test incremental note learning across the full song
        run: |
          mkdir -p /tmp/simplepiano-levels
          javac -d /tmp/simplepiano-levels \
            app/src/main/java/com/simplepianotest/app/SongData.java \
            app/src/main/java/com/simplepianotest/app/SongProgression.java \
            tests/com/simplepianotest/app/SongProgressionTest.java
          java -cp /tmp/simplepiano-levels com.simplepianotest.app.SongProgressionTest
      - name: Verify Golden MIDI and compact music keyboard
        run: |
          mkdir -p /tmp/simplepiano-golden
          javac -d /tmp/simplepiano-golden \
            app/src/main/java/com/simplepianotest/app/GoldenMidi.java \
            app/src/main/java/com/simplepianotest/app/GoldenLesson.java \
            app/src/main/java/com/simplepianotest/app/GoldenProgression.java \
            tests/com/simplepianotest/app/GoldenMidiTest.java
          java -cp /tmp/simplepiano-golden com.simplepianotest.app.GoldenMidiTest
      - name: Test Hebrew narration cue mapping
        run: |
          mkdir -p /tmp/simplepiano-voice
          javac -d /tmp/simplepiano-voice \
            app/src/main/java/com/simplepianotest/app/VoicePhrases.java \
            tests/com/simplepianotest/app/VoicePhrasesTest.java
          java -cp /tmp/simplepiano-voice com.simplepianotest.app.VoicePhrasesTest
      - name: Install Python for neural Hebrew voice recording
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render offline neural Hebrew voice prompts
        run: |
          python -m pip install --disable-pip-version-check "edge-tts>=7.0,<8.0"
          python scripts/render_hebrew_voice.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location("voices","scripts/render_hebrew_voice.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          missing=[k for k in mod.SCRIPTS if
              not (Path("app/src/main/assets/voice_he")/(k+".mp3")).is_file()]
          assert not missing, f"Voice clips missing: {missing}"
          assert len(mod.SCRIPTS)>=25, "Incomplete spoken lesson pack"
          print(f"Verified {len(mod.SCRIPTS)} natural Hebrew MP3 clips")
          PY
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Simple-Piano-TEST-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
