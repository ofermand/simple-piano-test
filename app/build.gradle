plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simplepianotest.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.simplepianotest.app'
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName '1.0-verified-flow'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
