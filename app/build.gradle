plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simplepianotest.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.simplepianotest.app'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.3-test'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
